<!DOCTYPE html>
<html lang="pt-BR" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Resource Hints -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://cdn.tailwindcss.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--head-->
    <title data-rh="true">PVS Decore | Pisos e instalação em São José dos Pinhais</title>
    <meta data-rh="true" name="description" content="Venda e instalação de pisos laminados, vinílicos, SPC e rodapés. Loja em São José dos Pinhais, atendimento em Curitiba e região." />
    <link data-rh="true" rel="canonical" href="https://www.pvsdecore.com.br/" />
    <!--/head-->
    <!-- Mobile / PWA -->
    <meta name="theme-color" content="#F97316" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PVS Decore" />
    <meta name="application-name" content="PVS Decore" />
    <meta name="format-detection" content="telephone=yes" />

    <!-- Font Optimization -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" as="style" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              brand: {
                orange: '#F97316',
                dark: '#111827',
                light: '#F3F4F6',
              }
            }
          }
        }
      }
    </script>

    <!-- Critical CSS -->
    <style>
      *{margin:0;padding:0;box-sizing:border-box}
      body{font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
      #root{min-height:100vh}
      html{overflow-wrap:break-word} img{max-width:100%} button,a{touch-action:manipulation} button{min-height:44px} summary{min-height:44px} :focus-visible{outline:3px solid #F97316;outline-offset:3px}
      @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
      @keyframes heartbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
      .animate-heartbeat{animation:heartbeat 1s infinite}
      @keyframes shimmer{0%{transform:translateX(-100%) skewX(-12deg)}100%{transform:translateX(200%) skewX(-12deg)}}
    </style>


</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>



    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function() {});
        });
      }
    </script>
  </body>
</html>
